variables:
    SMOKE_PRODUCT_NAME: KenoMatch
    DOCKER_SLIM: enable
    ENABLE_NODEJS_INTEGRATION_TEST: 'true'
    NODEJS_INTEGRATION_TEST_IMAGE_VERSION: hub.lumigame.com/base/node:18.1-buster-slim
    NODEJS_INTEGRATION_TEST_DB_IMAGE_VERSION: hub.lumigame.com/docker-hub/library/mongo:4.4.8

include:
  - project: "ci/repos-ci/pentagon_l1_keno_match_service"
    ref: master
    file: "gitlab-ci.yml"

  - project: "ci/repos-ci/pentagon_l2_keno_match_service"
    ref: master
    file: "gitlab-ci-mixing.yml"

  - project: "ci/common-ci"
    ref: rocketor
    file: "integration-test/nodejs-integration-test.gitlab-ci.yml"

unit-test-js:
  image: hub.lumigame.com/base/node:18.1-buster-slim
